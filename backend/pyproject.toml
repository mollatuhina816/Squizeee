[project]
name = "quizeee-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4", "redis>=5,<7", "celery>=5.4,<6",
  "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3",
  "openpyxl>=3.1,<4", "reportlab>=4,<6", "pillow>=11,<13",
  "pypdf>=6.19,<7", "python-pptx>=1.0.2,<2",
  "openai>=2,<3", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
